<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="psGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f53c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a785d" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#040705" stroke="url(#psGlow)" stroke-width="2"/>

  <!-- Subtle Inner Grid Corner Brackets -->
  <path d="M7 13 L7 7 L13 7" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none"/>
  <path d="M51 7 L57 7 L57 13" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none"/>
  <path d="M7 51 L7 57 L13 57" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none"/>
  <path d="M51 57 L57 57 L57 51" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- PS Monogram Typography -->
  <text x="31" y="40" font-family="'Geist Mono', 'SF Mono', 'Courier New', monospace" font-weight="800" font-size="25" fill="#f4f1ea" text-anchor="middle" letter-spacing="-1">PS</text>

  <!-- Live Active Builder Indicator Pip -->
  <circle cx="50" cy="14" r="3.5" fill="#c8f53c" filter="url(#neonBlur)"/>
  <circle cx="50" cy="14" r="2" fill="#ffffff"/>
</svg>
